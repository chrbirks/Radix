name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Type-check
        run: uv run mypy

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0

      - name: Tests
        run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  # The Linux binary is built inside a manylinux_2_34 container (AlmaLinux 9,
  # glibc 2.34) rather than on ubuntu-latest. PyInstaller bundles libpython but
  # NOT glibc, and glibc is forward-compatible only — a binary built against
  # glibc 2.38 (ubuntu-latest) fails on older distros with
  # "version 'GLIBC_2.38' not found". glibc 2.34 is PySide6 6.11's own wheel
  # floor (it ships only manylinux_2_34+ wheels), so it's the lowest glibc that
  # still has installable Qt wheels — the broadest target that buys anything
  # without downgrading PySide6. Covers Ubuntu 22.04+, Debian 12+, RHEL/Alma 9+.
  # `container:` is job-level and can't be conditioned per matrix leg, so Linux
  # and Windows are split into separate single-platform jobs.
  build-linux:
    needs: test
    runs-on: ubuntu-latest
    container:
      # Pin to a dated tag/digest once green for reproducible bundled system .so's.
      image: quay.io/pypa/manylinux_2_34_x86_64:latest
    steps:
      - uses: actions/checkout@v7

      - name: System Qt/runtime libraries (AlmaLinux 9)
        # Runs as root in-container (no sudo). RHEL equivalents of the Debian
        # libegl1/libxkbcommon0/libxcb-cursor0 plus the headless-PySide6
        # transitive set so PyInstaller's dependency scan copies every Qt .so.
        run: |
          dnf -y install \
            git \
            mesa-libEGL mesa-libGL \
            libxkbcommon libxkbcommon-x11 \
            xcb-util-cursor xcb-util-keysyms xcb-util-image \
            xcb-util-renderutil xcb-util-wm \
            libX11 libX11-xcb libXext libXrender libXi libXrandr \
            libXfixes libXcursor libXtst libxcb libXau \
            fontconfig freetype dbus-libs nss nspr expat zlib

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        # No python-version here; uv manages the interpreter in the next step so
        # we don't depend on the container's /opt/python cpython builds.

      - name: Provision Python 3.12 (uv-managed)
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --python 3.12

      - name: Freeze with PyInstaller (onedir)
        run: uv run pyinstaller packaging/radix.spec --distpath dist --workpath build --noconfirm
        # NOTE: keep PySide6 and PyInstaller pinned together (uv.lock); Qt point
        # releases have broken PyInstaller hooks before.

      - name: Smoke-test frozen binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out="$(./dist/radix/radix -e '0xFF << 2')"
          echo "$out"
          echo "$out" | grep -q '1020'

      - name: Assert glibc floor of bundled libpython
        # Should print at most GLIBC_2.34; anything higher means the build leaked
        # a newer symbol and the container isn't being used correctly.
        run: |
          objdump -T dist/radix/_internal/libpython3.12.so* \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -n1

      - name: Package tarball
        run: tar -C dist -czf radix-linux-x86_64.tar.gz radix

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: radix-Linux
          path: radix-linux-x86_64.tar.gz

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Freeze with PyInstaller (onedir)
        run: uv run pyinstaller packaging/radix.spec --distpath dist --workpath build --noconfirm
        # NOTE: keep PySide6 and PyInstaller pinned together (uv.lock); Qt point
        # releases have broken PyInstaller hooks before.

      - name: Smoke-test frozen binary
        # The exe is windowed (console=false), so stdout is discarded; the
        # smoke test asserts the exit code.
        run: ./dist/radix/radix.exe -e '0xFF << 2'
        shell: bash

      - name: Package zip
        run: Compress-Archive -Path dist/radix -DestinationPath radix-windows-x86_64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: radix-Windows
          path: radix-windows-x86_64.zip

  # Pushing an annotated `vN` tag (the "Release Radix N" commit) publishes a
  # GitHub release named "Radix N" with the `## [N]` CHANGELOG section as its
  # notes and the two frozen bundles attached. The tag must match
  # `radix.__version__`, otherwise the binaries would report the wrong version.
  release:
    needs: [build-linux, build-windows]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against radix.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/radix/__init__.py)"
          if [ "$tag" != "$src" ]; then
            echo "::error::tag is v$tag but radix.__version__ is \"$src\""
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
        id: version

      - name: Release notes from CHANGELOG.md
        # Everything between `## [N] - date` and the next `## [` heading.
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            /^## \[/ { on = 0 }
            on
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md has no [$v] section; release notes will be a pointer"
            echo "See CHANGELOG.md for this release." > notes.md
          fi
          cat notes.md

      - uses: actions/download-artifact@v8
        with:
          pattern: radix-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          name: Radix ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            radix-linux-x86_64.tar.gz
            radix-windows-x86_64.zip
          fail_on_unmatched_files: true
